name: Build Raksha AI APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Locate and Unzip Project
        run: |
          # अगर ज़िप फ़ाइल मौजूद है तो उसे अनज़िप करें
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Unzipping $ZIP_FILE..."
            unzip -o "$ZIP_FILE"
          fi
          
          # अगर अनज़िप होने के बाद फाइलें किसी सब-फ़ोल्डर में चली गई हैं तो उन्हें बाहर लाएँ
          if [ ! -f "settings.gradle.kts" ] && [ ! -f "settings.gradle" ]; then
            SETTINGS_PATH=$(find . -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1)
            if [ -n "$SETTINGS_PATH" ]; then
              DIR_PATH=$(dirname "$SETTINGS_PATH")
              echo "Moving files from $DIR_PATH to root..."
              cp -r "$DIR_PATH"/* .
            fi
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create Debug Keystore
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: |
          chmod +x gradlew || true
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RakshaAI-Debug-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
